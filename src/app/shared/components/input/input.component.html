<div class="relative w-full">
  <input
    #nativeInput
    [id]="inputId()"
    [type]="type() === 'password' ? (showPassword() ? 'text' : 'password') : type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [autocomplete]="autocomplete()"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
    class="block w-full rounded-xl border bg-white px-4 py-3 text-slate-950 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
    [class.border-red-400]="isInvalid()"
    [class.border-slate-300]="!isInvalid()"
    [class.pr-20]="type() === 'password'"
  />

  @if (type() === 'password') {
    <button
      type="button"
      class="absolute inset-y-0 right-0 flex items-center px-4 text-sm font-semibold text-slate-500 hover:text-slate-800"
      (click)="togglePasswordVisibility()"
      [attr.aria-label]="showPassword() ? 'Sembunyikan password' : 'Tampilkan password'"
    >
      {{ showPassword() ? 'Sembunyikan' : 'Lihat' }}
    </button>
  }
</div>

@if (isInvalid() && errorMessage()) {
  <p class="mt-2 text-sm text-red-600">
    {{ errorMessage() }}
  </p>
}
